services:
  - type: web
    name: kcpaan-inventory-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: KC_DB_PATH
        value: /data/kcpaan.db
    disk:
      name: kcpaan-data
      mountPath: /data
      sizeGB: 1
